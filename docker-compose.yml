# Single-server deployment: PostgreSQL, a one-shot release job, the API and
# Caddy serving the web app. Copy .env.example to .env and fill it in first.
#   docker compose up -d --build
# The project, database and role names can be set in .env; a server installed
# before the rename to Digital Bahi keeps its data that way (see HOW-TO-RUN.md,
# "Servers installed before the rename").
name: digitalbahi

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digitalbahi_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-digitalbahi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digitalbahi_owner} -d ${POSTGRES_DB:-digitalbahi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies migrations and grants as the schema owner, then exits.
  migrate:
    build: { context: ., target: migrate }
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-digitalbahi_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digitalbahi}
      APP_DB_ROLE: ${APP_DB_ROLE:-digitalbahi_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Connects as the non-owner role, so row-level security isolates tenants.
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${APP_DB_ROLE:-digitalbahi_app}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-digitalbahi}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run pnpm --filter @digitalbahi/api keys}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run pnpm --filter @digitalbahi/api keys}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?run pnpm --filter @digitalbahi/api keys}
      OTP_WEBHOOK_URL: ${OTP_WEBHOOK_URL:?set the OTP gateway URL}
      OTP_WEBHOOK_TOKEN: ${OTP_WEBHOOK_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      LOG_LEVEL: info
    # Error log files; read them with: docker compose exec api node dist/errors.js
    volumes:
      - api_logs:/app/logs
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  api_logs:
  caddy_data:
  caddy_config:
