name: Android app

# The Android app (apps/mobile): the web app's production build packaged with
# Capacitor, built into a debug APK, then installed and started on an Android
# emulator: the app must come up (its first screen asks for the server) with
# no crash and no script error. The APK is kept as an artifact to install.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/android.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm build

      - name: Put it in the Android project
        working-directory: apps/mobile
        run: pnpm exec cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: digitalbahi-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash apps/mobile/scripts/emulator-smoke.sh apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: What the app logged
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitalbahi-android-logcat
          path: |
            logcat.txt
            ui.xml
          if-no-files-found: ignore
