name: CI

# A branch is checked through its pull request: a push to a PR's branch used to start CI
# twice (once for the branch, once for the PR), which spent about a fifth of the month's
# Actions minutes on duplicates. "Run workflow" on the Actions tab checks any branch by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The db package creates and drops its own temporary database on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and database tests
        # A failure with no line of the project's code in its stack (a database error, a
        # timeout) gets no annotation from Vitest; the script makes one from the log.
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/tests.log" || {
            node .github/annotate-test-failures.mjs "$RUNNER_TEMP/tests.log"
            exit 1
          }

      - name: Migrations match the schema
        run: |
          pnpm --filter @digitalbahi/db generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"

      - name: Database reference matches the schema
        run: |
          pnpm db:docs
          git diff --exit-code -- docs/12-database-reference.md

      - name: Build web app
        run: pnpm build
